name: Convert PPTX

on:
  workflow_dispatch:
    inputs:
      input:
        description: "Input PPTX file"
        required: true
        default: "slides/course.pptx"
      output:
        description: "Output file. If empty, derived from input and format."
        required: false
        default: ""
      format:
        description: "Output format"
        required: true
        default: "pdf"
        type: choice
        options:
          - pptx
          - pdf
      report:
        description: "Conversion report level"
        required: true
        default: "summary"
        type: choice
        options:
          - none
          - summary
          - detail

permissions:
  contents: write
  packages: write

jobs:
  prepare-image:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v5

      - name: Compute image tag
        id: meta
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          REPO="${REPO,,}"

          HASH=$(
            sha256sum \
              .github/pptanim2pdf/Dockerfile \
              .github/pptanim2pdf/pptanim2pdf.py \
            | sha256sum \
            | cut -d' ' -f1
          )

          IMAGE="ghcr.io/${OWNER}/${REPO}-pptanim2pdf:${HASH}"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Using image: $IMAGE"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether image already exists
        id: check
        shell: bash
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.image }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image does not exist yet."
          fi

      - name: Build and push image if missing
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .github/pptanim2pdf
          file: .github/pptanim2pdf/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}

  convert:
    needs: prepare-image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install latest office2pdf
        if: inputs.format == 'pdf'
        id: office2pdf
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="$(gh release view --repo developer0hye/office2pdf --json tagName --jq '.tagName')"

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          gh release download "$TAG" --repo developer0hye/office2pdf --pattern '*x86_64-unknown-linux-musl.tar.gz' --dir "$TMP_DIR"

          ARCHIVE="$(find "$TMP_DIR" -maxdepth 1 -type f -name '*x86_64-unknown-linux-musl.tar.gz' -print -quit)"

          if [ -z "$ARCHIVE" ]; then
            echo "office2pdf release archive not found." >&2
            exit 1
          fi

          tar -xzf "$ARCHIVE" -C "$TMP_DIR"

          BIN="$(find "$TMP_DIR" -type f -name office2pdf -print -quit)"

          if [ -z "$BIN" ]; then
            echo "office2pdf executable not found in release archive." >&2
            exit 1
          fi

          sudo install -m 0755 "$BIN" /usr/local/bin/office2pdf

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          office2pdf --version

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute output path
        id: paths
        shell: bash
        run: |
          INPUT="${{ inputs.input }}"
          OUTPUT="${{ inputs.output }}"
          FORMAT="${{ inputs.format }}"

          if [ -z "$OUTPUT" ]; then
            BASE="${INPUT%.*}"

            if [ "$FORMAT" = "pdf" ]; then
              OUTPUT="${BASE}.pdf"
            else
              OUTPUT="${BASE}_split.pptx"
            fi
          fi

          mkdir -p "$(dirname "$OUTPUT")"

          echo "input=$INPUT" >> "$GITHUB_OUTPUT"
          echo "output=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "format=$FORMAT" >> "$GITHUB_OUTPUT"

          echo "Input : $INPUT"
          echo "Output: $OUTPUT"
          echo "Format: $FORMAT"

      - name: Convert presentation
        id: convert
        shell: bash
        run: |
          set +e

          INPUT="${{ steps.paths.outputs.input }}"
          OUTPUT="${{ steps.paths.outputs.output }}"
          FORMAT="${{ steps.paths.outputs.format }}"
          STATIC_PPTX="$RUNNER_TEMP/pptanim2pdf-static.pptx"

          : > conversion-report.txt

          if [ "$FORMAT" = "pdf" ]; then
            echo "== PPTAnim2PDF: generate static PPTX ==" >> conversion-report.txt

            docker run --rm \
              -v "$PWD:/work" \
              -v "$RUNNER_TEMP:/runner-temp" \
              -w /work \
              "${{ needs.prepare-image.outputs.image }}" \
              "$INPUT" \
              --format=pptx \
              -o /runner-temp/pptanim2pdf-static.pptx \
              --report="${{ inputs.report }}" \
              >> conversion-report.txt 2>&1

            STATUS=$?

            if [ "$STATUS" -eq 0 ]; then
              {
                echo
                echo "== office2pdf ${{ steps.office2pdf.outputs.tag }}: generate PDF =="
              } >> conversion-report.txt

              office2pdf "$STATIC_PPTX" -o "$OUTPUT" \
                >> conversion-report.txt 2>&1

              STATUS=$?
            fi
          else
            docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              "${{ needs.prepare-image.outputs.image }}" \
              "$INPUT" \
              --format=pptx \
              -o "$OUTPUT" \
              --report="${{ inputs.report }}" \
              >> conversion-report.txt 2>&1

            STATUS=$?
          fi

          cat conversion-report.txt

          {
            echo "## PPTAnim2PDF conversion"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Input | \`$INPUT\` |"
            echo "| Output | \`$OUTPUT\` |"
            echo "| Format | \`$FORMAT\` |"

            if [ "$FORMAT" = "pdf" ]; then
              echo "| PDF engine | \`office2pdf ${{ steps.office2pdf.outputs.tag }}\` |"
            fi

            echo "| Report level | \`${{ inputs.report }}\` |"
            echo "| Status | \`$STATUS\` |"
            echo

            if [ -s conversion-report.txt ]; then
              echo "### Converter report"
              echo
              echo '```text'
              cat conversion-report.txt
              echo '```'
            else
              echo "No converter report was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$STATUS"

      - name: Commit generated file
        shell: bash
        run: |
          OUTPUT="${{ steps.paths.outputs.output }}"

          if [ ! -f "$OUTPUT" ]; then
            echo "Generated file not found: $OUTPUT"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$OUTPUT"

          if git diff --cached --quiet; then
            echo "No changes to commit for $OUTPUT."
            exit 0
          fi

          git commit -m "Generate converted presentation"

          git push