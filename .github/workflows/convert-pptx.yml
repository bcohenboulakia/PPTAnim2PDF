name: Convert PPTX

on:
  workflow_dispatch:
    inputs:
      input:
        description: "Input PPTX file"
        required: true
        default: "slides/course.pptx"
      output:
        description: "Output file. If empty, derived from input and format."
        required: false
        default: ""
      format:
        description: "Output format"
        required: true
        default: "pdf"
        type: choice
        options:
          - pptx
          - pdf
      report:
        description: "Conversion report level"
        required: true
        default: "summary"
        type: choice
        options:
          - none
          - summary
          - detail
      office2pdf_mode:
        description: "office2pdf source (PDF only)"
        required: true
        default: latest-main
        type: choice
        options:
          - latest-main
          - latest-release
          - release-tag
          - commit-sha
      office2pdf_ref:
        description: "Release tag or full commit SHA for pinned modes (PDF only)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  convert:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate office2pdf selection
        if: inputs.format == 'pdf'
        shell: pwsh
        env:
          OFFICE2PDF_MODE: ${{ inputs.office2pdf_mode }}
          OFFICE2PDF_REF: ${{ inputs.office2pdf_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $mode = $env:OFFICE2PDF_MODE
          $ref = $env:OFFICE2PDF_REF.Trim()
          $pinned = $mode -in @('release-tag', 'commit-sha')

          if ($pinned -and -not $ref) {
            throw "office2pdf_ref is required when office2pdf_mode is '$mode'."
          }
          if ($mode -eq 'release-tag' -and $ref -cnotmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$') {
            throw 'Invalid office2pdf release tag (allowed: letters, digits, dot, underscore, hyphen).'
          }
          if ($mode -eq 'commit-sha' -and $ref -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'office2pdf_ref must be a full 40-character hexadecimal commit SHA.'
          }
          if (-not $pinned -and $ref) {
            Write-Host '::warning::office2pdf_ref is ignored for the selected automatic mode.'
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PPTAnim2PDF dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check lxml

      - name: Compute output path
        id: paths
        shell: pwsh
        env:
          INPUT_PATH: ${{ inputs.input }}
          OUTPUT_PATH: ${{ inputs.output }}
          OUTPUT_FORMAT: ${{ inputs.format }}
        run: |
          $ErrorActionPreference = 'Stop'
          $inputFile = $env:INPUT_PATH
          $outputFile = $env:OUTPUT_PATH
          $format = $env:OUTPUT_FORMAT

          if (-not (Test-Path -LiteralPath $inputFile -PathType Leaf)) {
            throw "Input PPTX not found: $inputFile"
          }
          if ([string]::IsNullOrWhiteSpace($outputFile)) {
            if ($format -eq 'pdf') {
              $outputFile = [IO.Path]::ChangeExtension($inputFile, '.pdf')
            } else {
              $directory = Split-Path -Parent $inputFile
              if (-not $directory) { $directory = '.' }
              $outputFile = Join-Path $directory (([IO.Path]::GetFileNameWithoutExtension($inputFile)) + '_split.pptx')
            }
          }
          if ([IO.Path]::GetFullPath($inputFile) -eq [IO.Path]::GetFullPath($outputFile)) {
            throw 'Output must not overwrite input.'
          }
          $parent = Split-Path -Parent $outputFile
          if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }

          "input=$inputFile" >> $env:GITHUB_OUTPUT
          "output=$outputFile" >> $env:GITHUB_OUTPUT
          "format=$format" >> $env:GITHUB_OUTPUT
          Write-Host "Input: $inputFile | Output: $outputFile | Format: $format"

      - name: Check fonts on Windows runner
        if: inputs.format == 'pdf'
        shell: pwsh
        env:
          INPUT_PATH: ${{ steps.paths.outputs.input }}
        run: |
          # Best-effort Latin font check. Does not alter the PPTX or block conversion.
          $ErrorActionPreference = 'Stop'
          try {
            Add-Type -AssemblyName System.Drawing
            Add-Type -AssemblyName System.IO.Compression
            $installed = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            foreach ($f in ([System.Drawing.Text.InstalledFontCollection]::new()).Families) {
              [void]$installed.Add($f.Name)
            }
            $needed = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $env:INPUT_PATH).Path)
            try {
              function Read-PptxXml($zip, $name) {
                $part = $zip.GetEntry($name)
                if ($null -eq $part) { return $null }
                $stream = $part.Open()
                $reader = [IO.StreamReader]::new($stream)
                try { return [xml]$reader.ReadToEnd() } finally { $reader.Dispose() }
              }
              $ns = [Xml.XmlNamespaceManager]::new(([xml]'<root/>').NameTable)
              $ns.AddNamespace('p', 'http://schemas.openxmlformats.org/presentationml/2006/main')
              $ns.AddNamespace('a', 'http://schemas.openxmlformats.org/drawingml/2006/main')
              $themePart = @($archive.Entries | Where-Object FullName -Match '^ppt/theme/theme\d+\.xml$' | Sort-Object FullName | Select-Object -First 1)
              $theme = if ($themePart.Count) { Read-PptxXml $archive $themePart[0].FullName } else { $null }
              $major = ''; $minor = ''
              if ($null -ne $theme) {
                $major = $theme.SelectSingleNode('//a:fontScheme/a:majorFont/a:latin', $ns).GetAttribute('typeface')
                $minor = $theme.SelectSingleNode('//a:fontScheme/a:minorFont/a:latin', $ns).GetAttribute('typeface')
              }
              function Resolve-Face([string]$name) {
                if ($name -match '^\+mj-') { return $major }
                if ($name -match '^\+mn-') { return $minor }
                return $name
              }
              $slideParts = @($archive.Entries | Where-Object FullName -Match '^ppt/slides/slide\d+\.xml$')
              foreach ($part in $slideParts) {
                $slide = Read-PptxXml $archive $part.FullName
                foreach ($shape in $slide.SelectNodes('//p:sp[p:txBody]', $ns)) {
                  $placeholder = $shape.SelectSingleNode('./p:nvSpPr/p:nvPr/p:ph', $ns)
                  $default = if ($null -ne $placeholder -and $placeholder.GetAttribute('type') -in @('title', 'ctrTitle')) { $major } else { $minor }
                  foreach ($para in $shape.SelectNodes('./p:txBody/a:p', $ns)) {
                    $pFontNode = $para.SelectSingleNode('./a:pPr/a:defRPr/a:latin', $ns)
                    $pFont = if ($null -ne $pFontNode) { $pFontNode.GetAttribute('typeface') } else { '' }
                    $level = 1
                    $ppr = $para.SelectSingleNode('./a:pPr', $ns)
                    if ($null -ne $ppr -and $ppr.HasAttribute('lvl')) { $level = [Math]::Max(1, [Math]::Min(9, [int]$ppr.GetAttribute('lvl') + 1)) }
                    $bodyFontNode = $shape.SelectSingleNode("./p:txBody/a:lstStyle/a:lvl${level}pPr/a:defRPr/a:latin", $ns)
                    if ($null -eq $bodyFontNode) { $bodyFontNode = $shape.SelectSingleNode('./p:txBody/a:lstStyle/a:defPPr/a:defRPr/a:latin', $ns) }
                    $bodyFont = if ($null -ne $bodyFontNode) { $bodyFontNode.GetAttribute('typeface') } else { '' }
                    foreach ($run in $para.SelectNodes('./a:r|./a:fld', $ns)) {
                      $text = $run.SelectSingleNode('./a:t', $ns)
                      if ($null -eq $text -or [string]::IsNullOrWhiteSpace($text.InnerText)) { continue }
                      $fontNode = $run.SelectSingleNode('./a:rPr/a:latin', $ns)
                      $font = if ($null -ne $fontNode) { $fontNode.GetAttribute('typeface') } else { '' }
                      if (-not $font) { $font = if ($pFont) { $pFont } elseif ($bodyFont) { $bodyFont } else { $default } }
                      $font = Resolve-Face $font
                      if ($font) { [void]$needed.Add($font) }
                    }
                  }
                }
                # A basic fallback for text inside slide tables.
                foreach ($run in $slide.SelectNodes('//a:tbl//a:r', $ns)) {
                  $text = $run.SelectSingleNode('./a:t', $ns)
                  if ($null -eq $text -or [string]::IsNullOrWhiteSpace($text.InnerText)) { continue }
                  $fontNode = $run.SelectSingleNode('./a:rPr/a:latin', $ns)
                  $font = if ($null -ne $fontNode) { $fontNode.GetAttribute('typeface') } else { $minor }
                  $font = Resolve-Face $font
                  if ($font) { [void]$needed.Add($font) }
                }
              }
            } finally {
              $archive.Dispose()
            }
            $missing = @($needed | Where-Object { -not $installed.Contains($_) } | Sort-Object)
            "`n### Font availability (Windows runner)`n" >> $env:GITHUB_STEP_SUMMARY
            if ($missing.Count) {
              $names = $missing -join ', '
              Write-Host "::warning title=Missing Windows font families::$names"
              "Missing font families: $names`n" >> $env:GITHUB_STEP_SUMMARY
            } elseif ($needed.Count) {
              "All detected Latin font families are installed.`n" >> $env:GITHUB_STEP_SUMMARY
            } else {
              "No Latin font families could be identified from slide text.`n" >> $env:GITHUB_STEP_SUMMARY
            }
            "*Best-effort check; this does not verify the face selected by office2pdf or all OOXML inheritance.*`n" >> $env:GITHUB_STEP_SUMMARY
          } catch {
            Write-Warning "Font audit unavailable; conversion will continue: $_"
            "`n### Font availability`n`nFont audit could not be completed: $($_.Exception.Message)`n" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Resolve office2pdf revision
        if: inputs.format == 'pdf'
        id: office2pdf-revision
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICE2PDF_MODE: ${{ inputs.office2pdf_mode }}
          OFFICE2PDF_REF: ${{ inputs.office2pdf_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $mode = $env:OFFICE2PDF_MODE
          $ref = $env:OFFICE2PDF_REF.Trim()
          $tag = ''
          $sha = ''

          switch ($mode) {
            'latest-release' {
              # GitHub's /releases/latest endpoint excludes drafts and prereleases.
              $tag = gh api 'repos/developer0hye/office2pdf/releases/latest' --jq '.tag_name'
              if ($LASTEXITCODE -ne 0 -or -not $tag) { throw 'Cannot resolve latest stable office2pdf release.' }
            }
            'release-tag' {
              # Unlike latest-release, an explicitly requested tag may be a prerelease.
              $tag = gh api "repos/developer0hye/office2pdf/releases/tags/$ref" --jq '.tag_name'
              if ($LASTEXITCODE -ne 0 -or -not $tag) { throw "office2pdf release not found: $ref" }
            }
            'latest-main' {
              # Freeze HEAD now. Any later push to upstream main cannot change this run.
              $line = git ls-remote https://github.com/developer0hye/office2pdf.git refs/heads/main
              if ($LASTEXITCODE -ne 0 -or -not $line) { throw 'Cannot resolve upstream office2pdf main.' }
              $sha = ($line -split '\s+')[0]
            }
            'commit-sha' {
              $sha = $ref.ToLowerInvariant()
            }
            default { throw "Unknown office2pdf mode: $mode" }
          }

          if ($tag) { $tag = "$tag".Trim() }
          if ($sha -and $sha -notmatch '^[0-9a-fA-F]{40}$') { throw "Invalid resolved commit SHA: $sha" }
          $identity = if ($tag) { $tag } else { $sha }
          if (-not $identity) { throw 'office2pdf version resolution returned an empty result.' }

          "mode=$mode" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "identity=$identity" >> $env:GITHUB_OUTPUT
          Write-Host "office2pdf: $mode => $identity"

      - name: Fetch office2pdf source at exact commit
        if: inputs.format == 'pdf' && (inputs.office2pdf_mode == 'latest-main' || inputs.office2pdf_mode == 'commit-sha')
        shell: pwsh
        env:
          OFFICE2PDF_SHA: ${{ steps.office2pdf-revision.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'office2pdf-source'
          New-Item -ItemType Directory -Force -Path $source | Out-Null
          git -C "$source" init -q
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize office2pdf source checkout.' }
          git -C "$source" remote add origin https://github.com/developer0hye/office2pdf.git
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure office2pdf upstream.' }
          git -C "$source" fetch --no-tags --depth 1 origin "$env:OFFICE2PDF_SHA"
          if ($LASTEXITCODE -ne 0) { throw "office2pdf commit cannot be fetched: $env:OFFICE2PDF_SHA" }
          git -C "$source" -c advice.detachedHead=false checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not check out selected office2pdf commit.' }
          $actual = (git -C "$source" rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:OFFICE2PDF_SHA) {
            throw "office2pdf commit mismatch: expected $env:OFFICE2PDF_SHA, got $actual"
          }
          Write-Host "Checked out office2pdf commit $actual"

      - name: Set up Rust
        if: inputs.format == 'pdf' && (inputs.office2pdf_mode == 'latest-main' || inputs.office2pdf_mode == 'commit-sha')
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and builds
        if: inputs.format == 'pdf' && (inputs.office2pdf_mode == 'latest-main' || inputs.office2pdf_mode == 'commit-sha')
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.temp }}/office2pdf-source -> target
          prefix-key: office2pdf-upstream

      - name: Install selected office2pdf (Windows)
        if: inputs.format == 'pdf'
        id: office2pdf
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICE2PDF_MODE: ${{ steps.office2pdf-revision.outputs.mode }}
          OFFICE2PDF_TAG: ${{ steps.office2pdf-revision.outputs.tag }}
          OFFICE2PDF_SHA: ${{ steps.office2pdf-revision.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $binDir = Join-Path $env:RUNNER_TEMP 'office2pdf-bin'
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $binary = Join-Path $binDir 'office2pdf.exe'

          if ($env:OFFICE2PDF_MODE -in @('latest-release', 'release-tag')) {
            $tag = $env:OFFICE2PDF_TAG
            $downloadDir = Join-Path $env:RUNNER_TEMP 'office2pdf-download'
            $extractDir = Join-Path $env:RUNNER_TEMP 'office2pdf-extracted'
            New-Item -ItemType Directory -Force -Path $downloadDir, $extractDir | Out-Null

            gh release download "$tag" --repo developer0hye/office2pdf --pattern '*x86_64-pc-windows-msvc.zip' --dir "$downloadDir"
            if ($LASTEXITCODE -ne 0) { throw "Cannot download official office2pdf release $tag." }
            $archives = @(Get-ChildItem -LiteralPath $downloadDir -Filter '*x86_64-pc-windows-msvc.zip' -File)
            if ($archives.Count -ne 1) { throw "Expected one Windows release archive, found $($archives.Count)." }
            Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $extractDir -Force
            $executables = @(Get-ChildItem -LiteralPath $extractDir -Filter 'office2pdf.exe' -File -Recurse)
            if ($executables.Count -ne 1) { throw "Expected one office2pdf.exe, found $($executables.Count)." }
            Copy-Item -LiteralPath $executables[0].FullName -Destination $binary -Force
          } else {
            $source = Join-Path $env:RUNNER_TEMP 'office2pdf-source'
            Push-Location $source
            try {
              cargo build --release --locked -p office2pdf-cli
              if ($LASTEXITCODE -ne 0) { throw "office2pdf compilation failed ($LASTEXITCODE)." }
            } finally {
              Pop-Location
            }
            $compiled = Join-Path $source 'target/release/office2pdf.exe'
            if (-not (Test-Path -LiteralPath $compiled -PathType Leaf)) {
              throw "Compiled office2pdf.exe not found: $compiled"
            }
            Copy-Item -LiteralPath $compiled -Destination $binary -Force
          }

          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw 'office2pdf executable could not start.' }
          $binaryHash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          "binary=$binary" >> $env:GITHUB_OUTPUT
          "binary_sha256=$binaryHash" >> $env:GITHUB_OUTPUT
          Write-Host "office2pdf executable SHA-256: $binaryHash"

      - name: Convert presentation
        id: convert
        shell: pwsh
        env:
          INPUT_PATH: ${{ steps.paths.outputs.input }}
          OUTPUT_PATH: ${{ steps.paths.outputs.output }}
          OUTPUT_FORMAT: ${{ steps.paths.outputs.format }}
          REPORT_LEVEL: ${{ inputs.report }}
          OFFICE2PDF_EXE: ${{ steps.office2pdf.outputs.binary }}
          OFFICE2PDF_IDENTITY: ${{ steps.office2pdf-revision.outputs.identity }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $reportPath = 'conversion-report.txt'
          if (Test-Path $reportPath) { Remove-Item $reportPath -Force }

          if ($env:OUTPUT_FORMAT -eq 'pdf') {
            $staticPptx = Join-Path $env:RUNNER_TEMP 'pptanim2pdf-static.pptx'
            '== PPTAnim2PDF: generate static PPTX ==' | Tee-Object -FilePath $reportPath -Append
            & python .github/pptanim2pdf/pptanim2pdf.py "$env:INPUT_PATH" --format=pptx -o "$staticPptx" "--report=$env:REPORT_LEVEL" 2>&1 | Tee-Object -FilePath $reportPath -Append
            if ($LASTEXITCODE -ne 0) { throw "PPTAnim2PDF failed ($LASTEXITCODE)." }

            "== office2pdf $($env:OFFICE2PDF_IDENTITY): generate PDF ==" | Tee-Object -FilePath $reportPath -Append
            & "$env:OFFICE2PDF_EXE" "$staticPptx" -o "$env:OUTPUT_PATH" 2>&1 | Tee-Object -FilePath $reportPath -Append
            if ($LASTEXITCODE -ne 0) { throw "office2pdf failed ($LASTEXITCODE)." }
          } else {
            & python .github/pptanim2pdf/pptanim2pdf.py "$env:INPUT_PATH" --format=pptx -o "$env:OUTPUT_PATH" "--report=$env:REPORT_LEVEL" 2>&1 | Tee-Object -FilePath $reportPath -Append
            if ($LASTEXITCODE -ne 0) { throw "PPTAnim2PDF failed ($LASTEXITCODE)." }
          }

      - name: Conversion summary
        if: always()
        shell: pwsh
        env:
          INPUT_PATH: ${{ steps.paths.outputs.input }}
          OUTPUT_PATH: ${{ steps.paths.outputs.output }}
          OUTPUT_FORMAT: ${{ steps.paths.outputs.format }}
          OFFICE2PDF_MODE: ${{ steps.office2pdf-revision.outputs.mode }}
          OFFICE2PDF_TAG: ${{ steps.office2pdf-revision.outputs.tag }}
          OFFICE2PDF_SHA: ${{ steps.office2pdf-revision.outputs.sha }}
          OFFICE2PDF_IDENTITY: ${{ steps.office2pdf-revision.outputs.identity }}
          OFFICE2PDF_BINARY_SHA256: ${{ steps.office2pdf.outputs.binary_sha256 }}
          REPORT_LEVEL: ${{ inputs.report }}
          CONVERSION_OUTCOME: ${{ steps.convert.outcome }}
        run: |
          "`n### PPTAnim2PDF conversion`n" >> $env:GITHUB_STEP_SUMMARY
          "| Field | Value |`n|---|---|" >> $env:GITHUB_STEP_SUMMARY
          "| Input | ``$env:INPUT_PATH`` |" >> $env:GITHUB_STEP_SUMMARY
          "| Output | ``$env:OUTPUT_PATH`` |" >> $env:GITHUB_STEP_SUMMARY
          "| Format | ``$env:OUTPUT_FORMAT`` |" >> $env:GITHUB_STEP_SUMMARY
          if ($env:OUTPUT_FORMAT -eq 'pdf') {
            "| PDF engine | ``office2pdf`` (Windows) |" >> $env:GITHUB_STEP_SUMMARY
            "| office2pdf mode | ``$env:OFFICE2PDF_MODE`` |" >> $env:GITHUB_STEP_SUMMARY
            if ($env:OFFICE2PDF_TAG) {
              "| Release tag | ``$env:OFFICE2PDF_TAG`` |" >> $env:GITHUB_STEP_SUMMARY
            }
            if ($env:OFFICE2PDF_SHA) {
              "| Source commit SHA | ``$env:OFFICE2PDF_SHA`` |" >> $env:GITHUB_STEP_SUMMARY
            }
            if ($env:OFFICE2PDF_BINARY_SHA256) {
              "| Executable SHA-256 | ``$env:OFFICE2PDF_BINARY_SHA256`` |" >> $env:GITHUB_STEP_SUMMARY
            }
          }
          "| Report level | ``$env:REPORT_LEVEL`` |" >> $env:GITHUB_STEP_SUMMARY
          "| Status | ``$env:CONVERSION_OUTCOME`` |`n" >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path 'conversion-report.txt') {
            "#### Converter report`n" >> $env:GITHUB_STEP_SUMMARY
            '```text' >> $env:GITHUB_STEP_SUMMARY
            Get-Content 'conversion-report.txt' | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Commit generated file
        shell: pwsh
        env:
          OUTPUT_PATH: ${{ steps.paths.outputs.output }}
        run: |
          if (-not (Test-Path -LiteralPath $env:OUTPUT_PATH -PathType Leaf)) {
            throw "Generated file not found: $env:OUTPUT_PATH"
          }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- "$env:OUTPUT_PATH"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit for $env:OUTPUT_PATH."
            exit 0
          }
          if ($LASTEXITCODE -ne 1) { throw "git diff failed ($LASTEXITCODE)." }
          git commit -m 'Generate converted presentation'
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed.' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'git push failed.' }
